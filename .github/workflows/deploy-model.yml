name: Deploy Approved Model

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EXECUTION_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
      MODEL_PACKAGE_GROUP_NAME: ClinicalSeverityModelPackageGroup
      ENDPOINT_NAME: clinical-severity-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Model From SageMaker Registry
        run: |
          set -e

          echo "Fetching latest approved model package..."

          MODEL_PACKAGE_ARN=$(aws sagemaker list-model-packages \
            --model-package-group-name $MODEL_PACKAGE_GROUP_NAME \
            --model-approval-status Approved \
            --sort-by CreationTime \
            --sort-order Descending \
            --query "ModelPackageSummaryList[0].ModelPackageArn" \
            --output text)

          if [ "$MODEL_PACKAGE_ARN" == "None" ]; then
            echo "No approved model found."
            exit 1
          fi

          echo "Model Package ARN: $MODEL_PACKAGE_ARN"

          MODEL_NAME="clinical-severity-model-${GITHUB_RUN_NUMBER}"
          CONFIG_NAME="clinical-severity-config-${GITHUB_RUN_NUMBER}"

          echo "Creating SageMaker model..."
          aws sagemaker create-model \
            --model-name $MODEL_NAME \
            --primary-container ModelPackageName=$MODEL_PACKAGE_ARN \
            --execution-role-arn $EXECUTION_ROLE_ARN

          echo "Creating endpoint configuration..."
          aws sagemaker create-endpoint-config \
            --endpoint-config-name $CONFIG_NAME \
            --production-variants VariantName=AllTraffic,ModelName=$MODEL_NAME,InitialInstanceCount=1,InstanceType=ml.m5.large

          echo "Checking if endpoint exists..."

          if aws sagemaker describe-endpoint --endpoint-name $ENDPOINT_NAME > /dev/null 2>&1; then
            echo "Updating existing endpoint..."
            aws sagemaker update-endpoint \
              --endpoint-name $ENDPOINT_NAME \
              --endpoint-config-name $CONFIG_NAME
          else
            echo "Creating new endpoint..."
            aws sagemaker create-endpoint \
              --endpoint-name $ENDPOINT_NAME \
              --endpoint-config-name $CONFIG_NAME
          fi

          echo "Deployment triggered successfully."